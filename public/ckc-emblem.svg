<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="16" fill="#8b1414"/>

  <!-- White inner rounded panel -->
  <rect x="22" y="22" width="156" height="156" rx="14" fill="#ffffff"/>

  <!-- 12-point sunburst medallion (clean single polygon) -->
  <g transform="translate(100,100)">
    <polygon
      fill="#ffffff"
      stroke="#8b1414"
      stroke-width="3"
      stroke-linejoin="miter"
      points="0,-58 10.9,-40.6 29,-50.2 29.7,-29.7 50.2,-29 40.6,-10.9 58,0 40.6,10.9 50.2,29 29.7,29.7 29,50.2 10.9,40.6 0,58 -10.9,40.6 -29,50.2 -29.7,29.7 -50.2,29 -40.6,10.9 -58,0 -40.6,-10.9 -50.2,-29 -29.7,-29.7 -29,-50.2 -10.9,-40.6"
    />
  </g>

  <!-- Inner circle -->
  <circle cx="100" cy="100" r="24" fill="#ffffff" stroke="#8b1414" stroke-width="2"/>

  <!-- Bold serif C -->
  <text x="100" y="115" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="34" fill="#8b1414">C</text>

  <!-- TM top-right of red square -->
  <text x="184" y="40" text-anchor="end" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#ffffff">TM</text>
</svg>
