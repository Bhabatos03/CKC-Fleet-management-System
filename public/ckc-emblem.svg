<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="14" fill="#8b1414"/>

  <!-- White inner rounded square -->
  <rect x="26" y="26" width="148" height="148" rx="14" fill="#ffffff"/>

  <!-- Sunburst medallion: 12 triangular points around a circle, all in red outline -->
  <g transform="translate(100,100)" fill="none" stroke="#8b1414" stroke-width="3.2" stroke-linejoin="miter">
    <!-- Star/burst outline (12-point) -->
    <polygon points="
      0,-58   9,-38   28.9,-49.9
      20,-28   47,-31   36,-12
      58,0    36,12    47,31
      20,28   28.9,49.9 9,38
      0,58   -9,38   -28.9,49.9
      -20,28  -47,31   -36,12
      -58,0   -36,-12  -47,-31
      -20,-28 -28.9,-49.9 -9,-38
    " fill="#ffffff" stroke="#8b1414" stroke-width="3"/>
  </g>

  <!-- Inner circle -->
  <circle cx="100" cy="100" r="30" fill="#ffffff" stroke="#8b1414" stroke-width="2.5"/>

  <!-- Letter C -->
  <text x="100" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="44" fill="#8b1414">C</text>

  <!-- Small TM outside the emblem to top-right -->
  <text x="180" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff">TM</text>
</svg>
